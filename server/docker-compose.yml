# =============================================================================
# agent-tokens leaderboard — Docker Compose (own3 / US cluster)
# =============================================================================
# Follows the own3 reverse-proxy convention (cf. viv-dashboard, pKa-estimation):
#   * NO `ports:` mapping — strictly prohibited. The proxy discovers this
#     container via labels and serves it at
#     https://token-leaderboard.own3.aganitha.ai (container_name = subdomain).
#   * Labels: user / description / port (internal container port) / security.
# =============================================================================
# Deploy (on own3, from the repo root):
#   bash scripts/setup_shared_dir.sh
#   docker compose -f server/docker-compose.yml up -d --build
# Open: https://token-leaderboard.own3.aganitha.ai
# =============================================================================

name: token-leaderboard

services:
  board:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: token-leaderboard
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - PORT=8734
    volumes:
      # Bind-mount the shared record dir so snapshots survive restarts and are
      # visible on the cluster filesystem. Created by setup_shared_dir.sh.
      - /shared/hriteek/token-leaderboard:/data
    labels:
      user: "hriteek"
      description: "Aganitha agent token-maxing leaderboard"
      port: "8734"
      security: "ldap"
